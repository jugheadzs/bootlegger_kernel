name: Begonia MIUI12 SukiSU test v10

on:
  push:
    branches:
      - begonia-sukisu-v9
    paths:
      - 'begonia-sukisu/patch_rules_legacy.py'
      - '.github/workflows/begonia-sukisu-v10.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Prepare corrected legacy patch driver
        working-directory: begonia-sukisu
        run: |
          sed -i 's/a = s.find(start)/a = s.rfind(start)/' patch_sukisu_manual.py
          sed -i 's/sukisu-miui12-test9/sukisu-miui12-test10/g' build-v9.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-v9.sh')
          s = p.read_text()
          needle = 'python3 patch_sukisu_manual.py\n'
          repl = needle + 'python3 "$ROOT/patch_rules_legacy.py"\n'
          if needle not in s:
              raise SystemExit('manual patch invocation not found')
          p.write_text(s.replace(needle, repl, 1))
          PY
          grep -n 'rfind(start)\|patch_rules_legacy\|test10' patch_sukisu_manual.py build-v9.sh

      - name: Build stock-based Begonia SukiSU Image.gz v10
        working-directory: begonia-sukisu
        run: bash build-v9.sh

      - name: Show artifacts
        if: always()
        run: find begonia-sukisu/artifacts -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: begonia-sukisu-miui12-test10
          path: begonia-sukisu/artifacts/*
          if-no-files-found: error
