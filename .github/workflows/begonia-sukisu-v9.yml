name: Begonia MIUI12 SukiSU test v9

on:
  push:
    branches:
      - begonia-sukisu-v9
    paths:
      - 'begonia-sukisu/build-v9.sh'
      - 'begonia-sukisu/patch_sukisu_manual.py'
      - '.github/workflows/begonia-sukisu-v9.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
      - name: Build stock-based Begonia SukiSU Image.gz v9
        working-directory: begonia-sukisu
        run: bash build-v9.sh
      - name: Show artifacts
        if: always()
        run: find begonia-sukisu/artifacts -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: begonia-sukisu-miui12-test9
          path: begonia-sukisu/artifacts/*
          if-no-files-found: error
